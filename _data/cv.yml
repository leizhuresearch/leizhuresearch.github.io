cv:
  name: Dr. Lei Zhu
  label: Postdoctoral Research Associate
  location: Department of Materials, University of Oxford, UK

  sections:
    Academic Interests:
      - name: Mechanics of hybrid materials
        keywords:
          - nonlinear mechanical response
          - fracture
          - lattice anharmonicity in inorganic–organic hybrid materials
      - name: Machine learning for materials
        keywords:
          - transferable machine-learned interatomic potentials
          - active learning for materials simulation
      - name: Multiscale modelling
        keywords:
          - quantum-mechanical, QM/MM and machine-learning methods across length and time scales
      - name: Defects, interfaces and degradation
        keywords:
          - atomic-scale mechanisms of performance and stability in semiconductors and energy materials

    Experience:
      - company: Department of Materials, University of Oxford
        position: Postdoctoral Research Associate
        location: Oxford, UK
        start_date: 2023
        end_date: present
        summary: Atomistic and machine-learning modelling of the mechanical, interfacial and defect properties of halide perovskites for solar cells.
        highlights:
          - Lead computational contributor in collaborations with experimental groups at Imperial College London and the University of Manchester, using DFT and ab initio molecular dynamics to explain how molecular additives work at perovskite interfaces.
          - Development of machine-learned interatomic potentials (MACE) with committee-based active learning for the mechanical properties of halide perovskites.

      - company: Department of Chemistry, University College London
        position: PhD Researcher
        location: London, UK
        start_date: 2017
        end_date: 2022
        summary: Multiscale modelling of intrinsic point defects in the wide-band-gap nitride AlN.
        highlights:
          - Derived a classical interatomic potential for wurtzite AlN and used it to identify interstitialcy migration mechanisms and revise vacancy migration barriers.
          - Applied hybrid QM/MM embedded-cluster methods (ChemShell) to establish the donor and acceptor character of intrinsic defects in AlN.
          - Calculated optical absorption, emission and carrier-capture behaviour of intrinsic defects, assigning specific defects to measured absorption and luminescence bands.

      - company: NationStar Semiconductor Co. Ltd
        position: R&D Engineering Intern
        location: Foshan, China
        start_date: 2017
        end_date: 2017
        summary: Operated MOCVD equipment for LED fabrication and characterised samples by X-ray diffraction and photoluminescence.

